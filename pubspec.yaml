name: laufen_front
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: "^3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # code generation
  freezed_annotation: ^3.1.0

  # ui
  flutter_svg: ^2.2.1
  mask_text_input_formatter: ^2.9.0
  auto_size_text: ^3.0.0
  fluttertoast: ^10.0.0
  animated_custom_dropdown: ^3.1.1
  modal_bottom_sheet: ^3.0.0
  barcode: ^2.2.9

  # local storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  awesome_bottom_bar: ^1.2.4
  convex_bottom_bar: ^3.2.0

  # graphql
  graphql: ^5.2.2
  graphql_flutter: ^5.2.1
  gql_exec: ^1.0.0+1
  gql_link: ^1.1.0
  gql_dio_link: ^2.0.0
  gql: ^1.0.1

  # network
  url_launcher: ^6.3.2
  http: ^1.5.0
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ">=4.0.0 <5.0.0"
  http_parser: ^4.1.2

  # encryption
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # logger
  logger: ^2.6.2

  # data format
  json_annotation: ^4.9.0
  provider: ^6.1.5+1
  intl: ^0.20.3
  equatable: ^2.0.7

  # streams
  rxdart: ^0.28.0

  # platform
  flutter_local_notifications: ^19.4.2
  firebase_crashlytics: ^5.0.2
  app_settings: ^9.0.0
  device_info_plus: ^13.2.0
  permission_handler: ^12.0.1
  package_info_plus: ^10.2.1
  connectivity_plus: ^6.1.1
  path: ^1.9.1
  google_fonts: ^6.3.2
  flutter_launcher_icons: ^0.14.4
  yandex_mapkit: ^4.2.1
  appmetrica_plugin: ^4.1.0
  screen_brightness: ^2.1.11
  local_auth: ^3.0.2

  # files
  file_picker: ^12.1.3
  path_provider: ^2.1.5
  flutter_inappwebview: ^6.2.0-beta.3
  image: ^4.5.4

  # state management
  flutter_bloc: ^9.1.1

  # dependency injection
  get_it: ^8.2.0
  injectable: ^3.0.0

  # localization:
  slang: ^4.9.0
  slang_flutter: ^4.9.0

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # navigation
  auto_route: ^11.1.0
  infinite_scroll_pagination: ^5.1.1
  cached_network_image: ^3.4.1
  image_network: ^2.6.0
  dotted_border: ^3.1.0
  photo_view: ^0.15.0
  pdfrx: ^2.2.8
  mime: ^2.0.0
  firebase_core: ^4.1.1
  share_plus: ^13.3.0
  gal: ^2.3.1
  pdf: ^3.12.0
  flutter_markdown_plus: ^1.0.12
  geolocator: ^13.0.4
  app_links: ^7.2.1
  liquid_glass_widgets: ^1.8.0

dev_dependencies:
  auto_route_generator: ^10.2.4
  flutter_test:
    sdk: flutter

  # code generation
  freezed: ^4.0.1
  retrofit_generator: ^10.2.10
  build_runner: ^2.16.0
  json_serializable: ^6.11.1

  # graphql
  graphql_codegen: ^3.0.2

  # dependency injection
  injectable_generator: ^3.1.3

  # localization
  slang_build_runner: ^4.9.0

  # analyzer
  flutter_lints: ^6.0.0

  # testing
  bloc_test: ^10.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
  - family: Manrope
    fonts:
      - asset: assets/fonts/Manrope/Manrope-Bold.ttf
      - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
      - asset: assets/fonts/Manrope/Manrope-ExtraLight.ttf
      - asset: assets/fonts/Manrope/Manrope-Light.ttf
      - asset: assets/fonts/Manrope/Manrope-Medium.ttf
      - asset: assets/fonts/Manrope/Manrope-Regular.ttf
      - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
  
